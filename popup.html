<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shiv Ad Blocker</title>
    <style>
        body {
            width: 260px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            text-align: center;
        }
        .status-box {
            background-color: #1e293b;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .active-text {
            color: #4ade80;
            font-weight: bold;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .footer {
            margin-top: 10px;
            font-size: 11px;
            text-align: center;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h2>SHIV AD BLOCKER</h2>
    <div class="status-box">
        Status: <span id="statusText" class="active-text">Active & Running</span>
    </div>
    <button id="toggleBtn">Disable Protection</button>
    <div class="footer">Shiv Computer Enterprise</div>
    <script src="popup.js"></script>
</body>
</html>
